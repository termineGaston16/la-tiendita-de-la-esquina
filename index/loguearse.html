<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingresa a tu cuenta | Tiendita de la Esquina</title>

    <!-- CSS BS-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">

    <!-- ------------------------------------ -->
    <!-- CSS -->
    <link rel="stylesheet" href="../css/estilo.css">

    <!-- ------------------------------------ -->
    <!-- ESTILO DE FUENTE EXTERNA -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Didact+Gothic&display=swap" rel="stylesheet">


    <!-- ------------------------------------ -->
    <!-- SEO -->
    <link rel="icon" href="../img/index/logo-favicon.png" type="image/png">
    <meta name="title" content="Ingresa a tu cuenta | Tiendita de la Esquina">
    <meta name="description" content="¡Logueate con tu cuenta gratis!">
</head>

<body>
    <!-- HEADER -->
    <header class="container-fluid bodyRegistrarHeader">
        <nav class="bodyRegistrarHeaderNav">
            <button class="btn bodyRegistrarHeaderBtnVolver">
                <a href="../index.html" class="bodyRegistrarHeaderBtnVolverLink">
                    <svg xmlns="http://www.w3.org/2000/svg" width="25" height="25" fill="currentColor"
                        class="bi bi-arrow-left-circle bodyRegistrarHeaderBtnVolverLinkLogo" viewBox="0 0 16 16">
                        <path fill-rule="evenodd"
                            d="M1 8a7 7 0 1 0 14 0A7 7 0 0 0 1 8m15 0A8 8 0 1 1 0 8a8 8 0 0 1 16 0m-4.5-.5a.5.5 0 0 1 0 1H5.707l2.147 2.146a.5.5 0 0 1-.708.708l-3-3a.5.5 0 0 1 0-.708l3-3a.5.5 0 1 1 .708.708L5.707 7.5z" />
                    </svg>
                </a>
            </button>
        </nav>
    </header>

    <!-- MAIN -->
    <main class="container-fluid form-signin w-100 m-auto">
        <h1 class="h3 mb-3 fw-normal">Ingresa tu cuenta</h1>

        <div class="form-floating" id="correoElectronicoLoguearContenedor">
            <input type="email" class="form-control" id="correoElectronicoLoguear"
                placeholder="(nombreYapellido@example.com)">
            <label for="correoElectronicoLoguear">Correo Electrónico:</label>
        </div>

        <div class="form-floating" id="contraseniaRegistrarloguearContenedor">
            <input type="password" class="form-control" id="contraseniaRegistrarloguear" placeholder="(****)">
            <label for="contraseniaRegistrarloguear">Contraseña:</label>
        </div>
        
        <button class="btn btn-primary" id="btnLoguearDatos">Entrar</button>
    </main>

    <!-- ------------------------------------ -->
    <!-- SWEET ALERT -->

    <!-- ------------------------------------ -->
    <!-- JS BS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
        crossorigin="anonymous"></script>

    <!-- ------------------------------------ -->
    <!-- JS -->
    <script src="../js/loguear.js"></script>
</body>

</html>
