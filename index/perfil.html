            <!-- fondo del nav -->
            <div class="overlay menuNavPerfilFondoNegro d-none" id="idMenuNavPerfilFondoNegro"></div>

            <!-- Menu Nav -->
            <div class="list-group menuNavPerfilOpen opacity-0" id="idMenuPerfilOpen">
                <button type="button" class="list-group-item list-group-item-action menuNavPerfilOpenBtn"
                    id="btnFotoPerfil">Cambiar foto de
                    perfil</button>
                <button type="button" class="list-group-item list-group-item-action menuNavPerfilOpenBtn"
                    id="btnCambiarDatosPersonales">Cambiar datos personales</button>
                <button type="button" class="list-group-item list-group-item-action menuNavPerfilOpenBtn"
                    id="btnCambiarContrasenia">Cambiar
                    contraseña</button>
                <button type="button" class="list-group-item list-group-item-action menuNavPerfilOpenBtn">Historial de
                    compras</button>
                <button type="button" class="list-group-item list-group-item-action menuNavPerfilOpenBtn">Metodos de
                    pago</button>
                <button type="button" class="list-group-item list-group-item-action menuNavPerfilOpenBtn"

        <!-- Tarjeta usuario -->
        <div class="d-flex justify-content-center mainPerfilTarjetaUsuario" id="tarjetaUsuario">
            <div class="spinner-border mainPerfilTarjetaUsuarioLogoLoading" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
        </div>

        <!-- Tarjeta datos -->
        <div class="mainPerfilTarjetaDatos" id="tarjetaDatos">
        </div>

    </main>
