<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrarse | Tiendita de la Esquina</title>

    <!-- CSS BS-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">

    <!-- ------------------------------------ -->
    <!-- CSS -->
    <link rel="stylesheet" href="../css/estilo.css">

    <!-- ------------------------------------ -->
    <!-- ESTILO DE FUENTE EXTERNA -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Didact+Gothic&display=swap" rel="stylesheet">


    <!-- ------------------------------------ -->
    <!-- SEO -->
    <link rel="icon" href="../img/index/logo-favicon.png" type="image/png">
    <meta name="title" content="Registrarse | Tiendita de la Esquina">
    <meta name="description"
        content="¡Registrate gratuitamente para poder empezar a conseguir tus consolas favoritas y revivir la nostalgia!">
</head>

<body class="bodyRegistrar">
    <!-- HEADER -->
    <header class="container-fluid bodyRegistrarHeader">
        <nav class="bodyRegistrarHeaderNav">
            <button class="btn bodyRegistrarHeaderBtnVolver">
                <a href="../index.html" class="bodyRegistrarHeaderBtnVolverLink">
                    <svg xmlns="http://www.w3.org/2000/svg" width="25" height="25" fill="currentColor"
                        class="bi bi-arrow-left-circle bodyRegistrarHeaderBtnVolverLinkLogo" viewBox="0 0 16 16">
                        <path fill-rule="evenodd"
                            d="M1 8a7 7 0 1 0 14 0A7 7 0 0 0 1 8m15 0A8 8 0 1 1 0 8a8 8 0 0 1 16 0m-4.5-.5a.5.5 0 0 1 0 1H5.707l2.147 2.146a.5.5 0 0 1-.708.708l-3-3a.5.5 0 0 1 0-.708l3-3a.5.5 0 1 1 .708.708L5.707 7.5z" />
                    </svg>
                </a>
            </button>
        </nav>
    </header>

    <!-- ------ -->
    <!-- MAIN -->
    <main class="container-fluid bodyRegistrarMain">
        <div class="py-5 text-center bodyRegistrarMainLogoContenedor">
            <img src="../img/index/logo-principal.png" alt="logo-principal" class="bodyRegistrarMainLogoContenedorImg">
            <p class="lead bodyRegistrarMainLogoContenedorImgText">¡Registrate gratuitamente para poder empezar a conseguir tus consolas favoritas y revivir la
                nostalgia!</p>
        </div>

        <div class="row g-5 bodyRegistrarMainBodyContenedor">
            <div class="bodyRegistrarMainBodyContenedorSub">
                <h4 class="mb-3 bodyRegistrarMainBodyContenedorTitle">Datos personales:</h4>
                
                <div class="row g-3 bodyRegistrarMainBodyContenedorSub1">

                    <!-- Nombres -->
                    <div class="col-sm-6 bodyRegistrarMainBodyCasillero" id="nombresRegistrarContenedor">
                        <label for="nombresRegistrar" class="form-label bodyRegistrarMainBodyCasilleroText">Nombres:</label>
                        <input type="text" class="form-control bodyRegistrarMainBodyCasilleroInput" id="nombresRegistrar"
                            placeholder="(Introduce tus nombres aquí)">
                    </div>

                    <!-- Apellidos -->
                    <div class="col-sm-6 bodyRegistrarMainBodyCasillero" id="apellidosRegistrarContenedor">
                        <label for="apellidosRegistrar" class="form-label bodyRegistrarMainBodyCasilleroText">Apellidos:</label>
                        <input type="text" class="form-control bodyRegistrarMainBodyCasilleroInput" id="apellidosRegistrar"
                            placeholder="(Introduce tus apellidos aquí)">
                    </div>

                    <!-- Nombre de usuario -->
                    <div class="col-12 bodyRegistrarMainBodyCasillero" id="nombreDeUsuarioRegistrarContenedor">
                        <label for="nombreDeUsuarioRegistrar" class="form-label bodyRegistrarMainBodyCasilleroText">Nombre de Usuario:</label>
                        <div class="input-group has-validation bodyRegistrarMainBodyCasilleroUser">
                            <span class="input-group-text bodyRegistrarMainBodyCasilleroUserSpan">@</span>
                            <input type="text" class="form-control bodyRegistrarMainBodyCasilleroUserInput" id="nombreDeUsuarioRegistrar"
                                placeholder="(Nombre para el perfil)">
                        </div>
                    </div>

                    <!-- Correo electrónico -->
                    <div class="col-12 bodyRegistrarMainBodyCasillero" id="correoElectronicoRegistrarContenedor">
                        <label for="correoElectronicoRegistrar" class="form-label bodyRegistrarMainBodyCasilleroText">Correo Electrónico:</label>
                        <input type="email" class="form-control bodyRegistrarMainBodyCasilleroInput" id="correoElectronicoRegistrar"
                            placeholder="(nombreYapellido@example.com)">
                    </div>

                    <!-- Contraseña -->
                    <div class="col-12 bodyRegistrarMainBodyCasillero" id="contraseniaRegistrarContenedor">
                        <label for="contraseniaRegistrar" class="form-label bodyRegistrarMainBodyCasilleroText">Crea una contraseña:</label>
                        <input type="password" class="form-control bodyRegistrarMainBodyCasilleroInput" id="contraseniaRegistrar" placeholder="(****)">
                    </div>

                    <!-- Revisar Contraseña -->
                    <div class="col-12 bodyRegistrarMainBodyCasillero" id="revisarContraseniaRegistrarContenedor">
                        <label for="revisarContraseniaRegistrar" class="form-label bodyRegistrarMainBodyCasilleroText">Confirmar contraseña:</label>
                        <input type="password" class="form-control bodyRegistrarMainBodyCasilleroInput" id="revisarContraseniaRegistrar"
                            placeholder="(Vuelve a introducir tu contraseña para validarla)">
                    </div>
                </div>

                <button class="btn bodyRegistrarMainBodyContenedorBtn" id="btnRegistrarDatos">¡Registrarse!</button>
            </div>
        </div>
    </main>

    <!-- ------------------------------------ -->
    <!-- SWEET ALERT -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- ------------------------------------ -->
    <!-- JS BS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
        crossorigin="anonymous"></script>

    <!-- ------------------------------------ -->
    <!-- JS -->
    <script src="../js/registracion.js"></script>
</body>

</html>
